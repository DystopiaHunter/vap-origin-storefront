r in the shop navigation.</p></div><button class="primary-btn" data-new-page>＋ Add page</button></div>${state.pages.map(p=>`<div class="admin-item" style="grid-template-columns:1fr auto"><div><strong>${esc(p.title)}</strong><small>${esc(p.content.slice(0,95))}${p.content.length>95?'…':''}</small></div><div class="item-actions"><button class="small-btn" data-edit-page="${esc(p.id)}">Edit</button><button class="small-btn danger" data-delete-page="${esc(p.id)}">Delete</button></div></div>`).join('')||'<p class="empty-state">No custom pages. Create one to add it to the navigation.</p>'}</div>`}else if(tab==='orders'){content=`<div class="panel"><h2>Pickup orders</h2>${state.orders.length?state.orders.slice().reverse().map(o=>`${orderMarkup(o)}<div class="item-actions" style="margin-top:-5px;margin-bottom:12px"><button class="small-btn" data-order-status="${esc(o.id)}">${o.status==='Awaiting confirmation'?'Mark ready for pickup':'Mark awaiting confirmation'}</button></div>`).join(''):'<p style="color:var(--muted);font-size:12px">No orders yet.</p>'}</div>`}else if(tab==='appearance'){content=`<div class="panel"><h2>Shop appearance</h2><form id="appearanceForm" class="form-grid"><div class="field"><label for="storeName">Shop name</label><input id="storeName" name="name" value="${esc(state.store.name)}" required></div><div class="field"><label for="tagline">Tagline</label><input id="tagline" name="tagline" value="${esc(state.store.tagline)}"></div><div class="field full"><label for="intro">Homepage headline</label><input id="intro" name="intro" value="${esc(state.store.intro)}"></div><div class="field full"><label>Accent color</label><div class="theme-swatches">${['#246149','#244f75','#a54835','#766537','#394d55'].map(c=>`<button type="button" class="swatch ${state.store.brand===c?'selected':''}" style="background:${c}" data-brand-color="${c}" aria-label="Set accent color ${c}"></button>`).join('')}</div></div><div class="field"><label for="customBrand">Custom accent</label><input id="customBrand" name="brand" type="color" value="${esc(state.store.brand)}"></div><div class="field"><label for="customPop">Highlight color</label><input id="customPop" name="pop" type="color" value="${esc(state.store.pop)}"></div><div class="field full"><label for="pickupText">Pickup information</label><textarea id="pickupText" name="pickup">${esc(state.store.pickup)}</textarea></div></form></div>`}else content=`<div class="panel"><h2>Store settings</h2><p style="color:var(--muted);font-size:12px;line-height:1.7">Customers order online and collect in person. No payment is taken on this demo storefront. All store data is saved in this browser.</p><div class="pickup-note">Demo staff access is disabled until secure authentication is configured.</div><button class="small-btn danger" data-reset>Restore starter shop</button></div>`;return `<div class="page-head"><div><p class="eyebrow">Your shop, your rules</p><h1 class="serif">Admin panel</h1><p>Changes save as you make them.</p></div></div><div class="admin-tabs">${[['overview','Overview'],['products','Products'],['pages','Pages'],['orders','Orders'],['appearance','Appearance'],['settings','Settings']].map(([id,label])=>`<button class="admin-tab ${tab===id?'active':''}" data-admin-tab="${id}">${label}</button>`).join('')}</div>${content}`}

();setTheme();renderPage()}));const appearance=el('appearanceForm');if(appearance){appearance.addEventListener('input',()=>{for(const [k,v] of new FormData(appearance))state.store[k]=v;save();setTheme();el('brandName').textContent=state.store.name});}const reset=el('reset');if(reset)reset.addEventListener('click',resetShop)}
    function addCart(id){const p=state.products.find(x=>x.id===id);if(!p)return;const found=state.cart.find(x=>x.id===id);if(found)found.qty++;else state.cart.push({id,qty:1});save();shell();toast(p.name+' added to your bag.')}

ve();drawCart()}));const place=drawer.querySelector('[data-place-order]');if(place)place.addEventListener('click',placeOrder)}

  <script>
    const appearanceDefaults={fontFamily:'dm-sans',fontSize:14,theme:'light'};
    const fontStacks={
      'dm-sans':"'DM Sans',sans-serif",
      'dm-serif':"'DM Serif Display',Georgia,serif",
      georgia:'Georgia,serif',
      system:'system-ui,sans-serif'
    };
    state.preferences={...appearanceDefaults,...(state.preferences||{})};
    const originalSetTheme=setTheme;
    setTheme=function(){
      originalSetTheme();
      const preferences=state.preferences||appearanceDefaults;
      const root=document.documentElement;
      root.dataset.theme=preferences.theme;
      if(preferences.theme==='midnight'){
        root.style.setProperty('--brand','#70c1d4');
        root.style.setProperty('--brand-dark','#3f879c');
        root.style.setProperty('--pop','#f0a27e');
      }else{
        root.style.setProperty('--brand',state.store.brand);
        root.style.setProperty('--brand-dark',shade(state.store.brand));
        root.style.setProperty('--pop',state.store.pop);
      }
      document.body.style.fontFamily=fontStacks[preferences.fontFamily]||fontStacks['dm-sans'];
      applyTypography();
    };
    const baseFontSizes=new WeakMap();
    function applyTypography(){
      const scale=Number(state.preferences?.fontSize||14)/14;
      const family=state.preferences?.fontFamily||'dm-sans';
      document.querySelectorAll('#app .serif').forEach(node=>{
        if(family==='dm-sans')node.style.removeProperty('font-family');
        else node.style.fontFamily=fontStacks[family]||fontStacks['dm-sans'];
      });
      document.querySelectorAll('#app *').forEach(node=>{
        if(node.matches('.logo-mark,.nav-icon,.search-symbol,.count,.quick-add,input[type="range"]'))return;
        const hasText=[...node.childNodes].some(child=>child.nodeType===Node.TEXT_NODE&&child.textContent.trim());
        if(!hasText&&!node.matches('input:not([type="range"]),textarea,select'))return;
        if(!baseFontSizes.has(node))baseFontSizes.set(node,parseFloat(getComputedStyle(node).fontSize));
        node.style.fontSize=`${baseFontSizes.get(node)*scale}px`;
      });
    }
    function settingsPage(){
      const preferences=state.preferences||appearanceDefaults;
      return `<div class="page-head"><div><p class="eyebrow">Make it yours</p><h1 class="serif">Site settings</h1><p>Choose how the shop looks and reads on this device.</p></div></div><div class="panel"><h2>Reading &amp; appearance</h2><form id="preferencesForm" class="form-grid"><div class="field"><label for="fontFamily">Font family</label><select id="fontFamily" name="fontFamily"><option value="dm-sans" ${preferences.fontFamily==='dm-sans'?'selected':''}>DM Sans</option><option value="dm-serif" ${preferences.fontFamily==='dm-serif'?'selected':''}>DM Serif Display</option><option value="georgia" ${preferences.fontFamily==='georgia'?'selected':''}>Georgia</option><option value="system" ${preferences.fontFamily==='system'?'selected':''}>System sans-serif</option></select></div><div class="field"><label for="siteTheme">Website theme</label><select id="siteTheme" name="theme"><option value="light" ${preferences.theme==='light'?'selected':''}>Light</option><option value="midnight" ${preferences.theme==='midnight'?'selected':''}>Midnight</option><option value="mist" ${preferences.theme==='mist'?'selected':''}>Mist</option></select></div><div class="field full"><label for="fontSize">Text size</label><div class="font-size-control"><input id="fontSize" name="fontSize" type="range" min="12" max="20" step="1" value="${preferences.fontSize}"><output id="fontSizeValue" class="font-size-value" for="fontSize">${preferences.fontSize}px</output></div><div class="type-preview"><span class="eyebrow">Preview</span><p>A little more good.</p><span>Thoughtful finds for slower mornings and brighter days.</span></div></div></form></div>`;
    }
    const originalNav=nav;
    nav=function(){return originalNav().replace('<div class="side-bottom">','<div class="side-bottom">'+pageLink('settings','Settings','⚙',state.activePage==='settings'))};
    const originalShell=shell;
    shell=function(){
      originalShell();
      const actions=document.querySelector('.top-actions');
      if(!actions||el('siteSettingsButton'))return;
      const button=document.createElement('button');
      button.id='siteSettingsButton';
      button.className='icon-btn site-settings-button';
      button.setAttribute('aria-label','Site settings');
      button.title='Site settings';
      button.innerHTML='<span aria-hidden="true">⚙</span><span class="settings-label">Settings</span>';
      button.addEventListener('click',()=>{
        state.activePage='settings';
        state.search='';
        save();
        shell();
        window.scrollTo(0,0);
      });
      actions.insertBefore(button,actions.children[1]||null);
    };
    const originalBindPage=bindPage;
    bindPage=function(){
      originalBindPage();
      const form=el('preferencesForm');
      if(!form)return;
      const size=el('fontSize');
      const sizeValue=el('fontSizeValue');
      form.querySelector('#fontFamily').addEventListener('change',event=>{
        state.preferences.fontFamily=event.target.value;
        save();
        setTheme();
      });
      form.querySelector('#siteTheme').addEventListener('change',event=>{
        state.preferences.theme=event.target.value;
        save();
        setTheme();
      });
      size.addEventListener('input',()=>{
        state.preferences.fontSize=Number(size.value);
        sizeValue.value=`${size.value}px`;
        sizeValue.textContent=`${size.value}px`;
        applyTypography();
      });
      size.addEventListener('change',save);
    };
    const originalResetShop=resetShop;
    resetShop=function(){
      originalResetShop();
      state.preferences={...appearanceDefaults};
      save();
      setTheme();
    };
    const originalRenderPage=renderPage;
    renderPage=function(){
      if(state.activePage==='settings'){
        el('mainContent').innerHTML=settingsPage();
        bindPage();
      }else originalRenderPage();
      applyTypography();
    };
    shell();
  </script>
  <script src="seller-app.js"></script>
  <script src="locales.js"></script>
  <script src="firebase-client.js"></script>
</body>
</html>
